name: pdfme_flutter
description: Generate PDFs in Flutter from pdfme Designer templates.
version: 0.1.0
homepage: https://pdfme.com

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pdfme.pdfme_flutter
        pluginClass: PdfmeFlutterPlugin
      ios:
        pluginClass: PdfmeFlutterPlugin
