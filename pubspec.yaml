name: pdfme_flutter
description: >
  Generate PDFs on-device from pdfme Designer templates.
  Pass template JSON and inputs, get PDF bytes — no server required.
version: 0.1.0
homepage: https://github.com/kameshWB/pdfme_flutter
repository: https://github.com/kameshWB/pdfme_flutter
issue_tracker: https://github.com/kameshWB/pdfme_flutter/issues
documentation: https://github.com/kameshWB/pdfme_flutter#readme

topics:
  - pdf
  - pdfme
  - generator
  - offline
  - flutter-plugin

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pdfme.pdfme_flutter
        pluginClass: PdfmeFlutterPlugin
      ios:
        pluginClass: PdfmeFlutterPlugin
